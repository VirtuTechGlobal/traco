<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traco - Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <div class="header-bg"></div>

        <header>
            <i class="fas fa-arrow-left" onclick="window.location.href='index.html'" style="cursor: pointer;"></i>
            <div class="logo">Profile</div>
            <div style="width: 24px;"></div> 
        </header>

        <section class="profile-main">
            <div class="profile-image-container">
                <img src="https://i.pravatar.cc/100" alt="Profile" class="large-profile-pic">
                <div class="edit-badge"><i class="fas fa-camera"></i></div>
            </div>
            
            <div class="profile-details">
                <h2>Alma Lawson</h2>
                <p>alma.lawson@example.com</p>
            </div>
        </section>

        <div class="profile-options">
            <div class="option-item">
                <i class="fas fa-user"></i>
                <span>Personal Information</span>
                <i class="fas fa-chevron-right arrow"></i>
            </div>
            <div class="option-item">
                <i class="fas fa-bell"></i>
                <span>Notifications</span>
                <i class="fas fa-chevron-right arrow"></i>
            </div>
            <div class="option-item">
                <i class="fas fa-lock"></i>
                <span>Security</span>
                <i class="fas fa-chevron-right arrow"></i>
            </div>
            <div class="option-item logout">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </div>
        </div>
    </div>

</body>
</html>
